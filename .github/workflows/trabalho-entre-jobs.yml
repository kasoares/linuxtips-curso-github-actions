name: Trabalho entre jobs

on:
    push:
      branches: 
        - main
    
jobs:
    job_1: 
      runs-on: ubuntu-latest
      steps:
        - name: Confere vesao do Ubuntu
          run: cat /etc/os-release

        - name: Exibir uma mensagem
          run: echo "Estou fazendo o curso de github Actions da Linuxtips" > ${{ github.workspace }}/mensagem.txt
    
        - uses: actions/upload-artifact@v4
          with:
            name: strigus-upload
            path: ${{ github.workspace }}/mensagem.txt

    job_2:
      runs-on: ubuntu-latest
      needs: job_1
      steps:
        - uses: actions/download-artifact@v4
          with:
            name: strigus-upload
            path: strigus

        - name: Ver o conteudo do diretorio
          run: ls -lha
        
        - name: lê conteudo do arquivo
          run: cat strigus/mensagem.txt