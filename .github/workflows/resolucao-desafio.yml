name: validacao de imagens de container

on:
   workflow_dispatch:
      inputs:
         validaImagemDocker:
             description: 'Validação de iamgem escolhida pelo usuário'
             required: false
             default: 'nginx:latest'
             type: string

jobs:
    pipeline-seguranca:
        runs-on: ubuntu-latest

        steps: 

            - name: Checkout
              uses: actions/checkout@v4

            - name: Baixa a imagem do container
              run: |
                docker pull ${{github.event.inputs.validaImagemDocker}}

            - name: Leitura da imagem
              run: |
                IMAGE_NAME=$(echo "${{github.event.inputs.validaImagemDocker}}" | cut -d ':' -f1)
                docker images | grep $IMAGE_NAME

            - name: Scan com scout
              uses: docker/scout-action@v1
              with:
                image: ${{github.event.inputs.validaImagemDocker}}
                only-severities: critical,high
